title = "SectorLab secrets and private metadata"

[extend]
useDefault = true

[[rules]]
id = "local-user-directory"
description = "Machine-local username in a recorded path"
regex = '''(?i)(?:[a-z]:[\\/]+Users[\\/]+|/Users/|/home/)[\p{L}\p{N}_.-]+'''

[[rules]]
id = "personal-email-address"
description = "Personal mailbox in project files"
regex = '''(?i)[a-z0-9._%+-]+@(?:gmail\.com|mail\.ru|yandex\.(?:ru|com)|outlook\.com|hotmail\.com|icloud\.com|proton(?:mail)?\.(?:com|me))'''

[[rules]]
id = "private-key-header"
description = "Private key material must stay outside Git"
regex = '''-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----'''
