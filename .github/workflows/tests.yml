# EditMode + PlayMode tests in a GameCI Unity container.
# License preflight fails explicitly when credentials are absent; a green hygiene run never
# substitutes for Unity validation. Do not use pull_request_target to expose secrets to fork code.
name: Unity tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [EditMode, PlayMode]
    steps:
      - name: Check Unity license configuration
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is required for Unity tests."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.mode }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.mode }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.4f1
          testMode: ${{ matrix.mode }}
          customParameters: -assemblyNames SectorLab.Tests.${{ matrix.mode }}
          coverageEnabled: false
          artifactsPath: test-results-${{ matrix.mode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.mode }} results

      - uses: actions/upload-artifact@v4
        if: always() && steps.tests.outcome != 'skipped'
        with:
          name: test-results-${{ matrix.mode }}
          path: test-results-${{ matrix.mode }}
